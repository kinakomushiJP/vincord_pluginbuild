<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vencord Web Builder</title><link rel="stylesheet" href="style.css"></head><body><main><header><div class="tag">CUSTOM VENCORD BUILDER</div><h1>Vencord Web Builder</h1><p>プラグインZIPを入れるだけで、あなた用のVencordをビルド。</p></header><section class="card"><h2>プラグイン</h2><div id="drop"><b>ZIPをここへドラッグ＆ドロップ</b><span>または</span><button id="pick">ZIPを追加</button><input id="files" type="file" accept=".zip" multiple hidden></div><div id="list"></div></section><button id="build">🚀 ビルド開始</button><section class="card"><h2>ビルド状況</h2><pre id="log">プラグインを追加して「ビルド開始」を押してください。</pre><div id="result"></div></section><footer>Vencord Web Builder</footer></main><script src="app.js"></script></body></html>
