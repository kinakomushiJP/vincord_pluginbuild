name: Build Vencord custom
on: {workflow_dispatch: {}}
permissions: {contents: read, actions: read}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: corepack enable
      - name: Clone Vencord
        run: git clone --depth 1 https://github.com/Vendicated/Vencord.git vencord
      - name: Install dependencies
        working-directory: vencord
        run: pnpm install --frozen-lockfile
      - name: Install uploaded plugins
        run: |
          python3 - <<'PY'
          import json,glob,zipfile,os,shutil
          ms=glob.glob('builder-plugins/*/manifest.json')
          if not ms: raise SystemExit('manifest not found')
          m=json.load(open(ms[-1],encoding='utf8'))
          os.makedirs('vencord/src/userplugins',exist_ok=True)
          for item in m['plugins']:
            tmp='/tmp/plugin'; shutil.rmtree(tmp,ignore_errors=True); os.makedirs(tmp)
            with zipfile.ZipFile(item['path']) as z:z.extractall(tmp)
            c=[]
            for r,d,fs in os.walk(tmp):
              if 'index.ts' in fs or 'index.tsx' in fs:c.append(r)
            if not c: raise SystemExit('No index.ts(x) in '+item['name'])
            src=c[0]; name=os.path.basename(src); dst='vencord/src/userplugins/'+name
            shutil.rmtree(dst,ignore_errors=True); shutil.copytree(src,dst)
          PY
      - name: Build Vencord
        working-directory: vencord
        run: pnpm build --standalone
      - name: Package
        run: |
          mkdir out
          cp -a vencord/dist out/dist
          cd out && zip -r ../Vencord-custom-build.zip dist
      - uses: actions/upload-artifact@v4
        with: {name: Vencord-custom-build, path: Vencord-custom-build.zip, retention-days: 7}
